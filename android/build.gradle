plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jlleitschuh.gradle.ktlint' version '12.1.1'
}

group = 'net.guitar0.metronome'
version = '1.0.0'

// The host app decides which ABIs it ships; a library that builds fewer leaves the
// app installable on a device where System.loadLibrary then fails.
def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
  namespace "net.guitar0.metronome"

  // Build with the host app's NDK instead of AGP's bundled default,
  // the same way expo-modules-core and React Native libraries do.
  if (rootProject.hasProperty("ndkPath")) {
    ndkPath rootProject.ext.ndkPath
  }
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  defaultConfig {
    versionCode 1
    versionName "1.0.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
        // NDK r27 still aligns ELF segments to 4 KB by default; Google Play rejects
        // libraries that cannot load on 16 KB page devices (Android 15+).
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
    ndk {
      abiFilters(*reactNativeArchitectures())
    }
  }

  buildFeatures {
    prefab true
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  lint {
    abortOnError true
    warningsAsErrors false
    checkDependencies false
  }

  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }

  packaging {
    jniLibs {
      pickFirsts += ["lib/**/libc++_shared.so"]
    }
  }
}

dependencies {
  implementation "com.google.oboe:oboe:1.11.0"

  testImplementation 'junit:junit:4.13.2'
  // Robolectric so the notification and service tests run in the normal `test` task —
  // an instrumented-only suite needs an emulator and would not run in CI at all.
  testImplementation 'org.robolectric:robolectric:4.16'
  testImplementation 'androidx.test.ext:junit:1.3.0'

  // MetronomeStreamTest opens a real Oboe stream, so it stays instrumented.
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.7.0'
}
