name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "example/android/**"
      - "example/package.json"
      - "example/package-lock.json"
      - "app.plugin.js"
      - "plugin/src/**"
      - "package.json"
      - "package-lock.json"
      - "expo-module.config.json"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "example/android/**"
      - "example/package.json"
      - "example/package-lock.json"
      - "app.plugin.js"
      - "plugin/src/**"
      - "package.json"
      - "package-lock.json"
      - "expo-module.config.json"
      - ".github/workflows/ci-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"
  # The SDK the committed example app is on; other matrix entries regenerate it.
  EXAMPLE_EXPO_SDK: "57"

jobs:
  android-kotlin-lint:
    name: Android — ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node with cache
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint
        working-directory: example/android
        run: ./gradlew :expo-precision-metronome:ktlintCheck --no-daemon

  android-lint:
    name: Android — Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node with cache
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint
        working-directory: example/android
        run: ./gradlew :expo-precision-metronome:lint --no-daemon

      - name: Upload Lint report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-lint-report
          path: android/build/reports/lint-results-debug.xml
          retention-days: 7

  android-unit-tests:
    name: Android — JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node with cache
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        working-directory: example/android
        run: ./gradlew :expo-precision-metronome:test --no-daemon

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-unit-test-report
          path: android/build/reports/tests/
          retention-days: 7

  android-build:
    name: Android — build (Expo SDK ${{ matrix.expo-sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [android-kotlin-lint, android-lint, android-unit-tests]
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with peerDependencies and the README compatibility table.
        expo-sdk: ["55", "56", "57"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node with cache
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install root dependencies
        run: npm ci

      - name: Build plugin and package
        run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      # Each SDK ships its own React Native, AGP and native project template,
      # so the example is moved to that SDK and its android/ project regenerated.
      - name: Switch example to Expo SDK ${{ matrix.expo-sdk }}
        if: matrix.expo-sdk != env.EXAMPLE_EXPO_SDK
        working-directory: example
        run: |
          npm install "expo@~${{ matrix.expo-sdk }}.0.0"
          npx expo install --fix
          npx expo prebuild --clean --no-install --platform android

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android (Expo SDK ${{ matrix.expo-sdk }})
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon

      # Google Play rejects apps whose native libraries cannot load on 16 KB page devices.
      - name: Check 16 KB page alignment of native libraries
        run: |
          libs=$(find android/build/intermediates/merged_native_libs -name 'libmetronome.so')
          [ -n "$libs" ] || { echo "libmetronome.so not found"; exit 1; }
          status=0
          for lib in $libs; do
            for align in $(readelf -lW "$lib" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((align)) -lt 16384 ]; then
                echo "::error file=$lib::LOAD segment aligned to $align, expected at least 0x4000"
                status=1
              fi
            done
            echo "$lib OK"
          done
          exit $status
