name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "example/ios/**"
      - "example/package.json"
      - "example/package-lock.json"
      - "app.plugin.js"
      - "plugin/src/**"
      - "package.json"
      - "package-lock.json"
      - "expo-module.config.json"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "example/ios/**"
      - "example/package.json"
      - "example/package-lock.json"
      - "app.plugin.js"
      - "plugin/src/**"
      - "package.json"
      - "package-lock.json"
      - "expo-module.config.json"
      - ".github/workflows/ci-ios.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"
  # The SDK the committed example app is on; other matrix entries regenerate it.
  EXAMPLE_EXPO_SDK: "57"

jobs:
  ios-swiftlint:
    name: iOS — SwiftLint
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.x"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  ios-swift-tests:
    name: iOS — Swift unit tests
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.x"

      - name: Run Swift tests
        run: swift test --package-path ios

  ios-build:
    name: iOS — build (Expo SDK ${{ matrix.expo-sdk }})
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [ios-swiftlint, ios-swift-tests]
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with peerDependencies and the README compatibility table.
        expo-sdk: ["55", "56", "57"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.x"

      - name: Setup Node with cache
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build plugin and package
        run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      # Each SDK ships its own React Native, deployment target and native project
      # template, so the example is moved to that SDK and its ios/ project regenerated.
      - name: Switch example to Expo SDK ${{ matrix.expo-sdk }}
        if: matrix.expo-sdk != env.EXAMPLE_EXPO_SDK
        working-directory: example
        run: |
          npm install "expo@~${{ matrix.expo-sdk }}.0.0"
          npx expo install --fix
          npx expo prebuild --clean --no-install --platform ios

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      - name: Build iOS (simulator, no signing)
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace expoprecisionmetronomeexample.xcworkspace \
            -scheme expoprecisionmetronomeexample \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
